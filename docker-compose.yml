services:
  mediawiki:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: simtwiki-mediawiki

    restart: unless-stopped

    ports:
      - "${MEDIAWIKI_PORT:-8080}:80"

    depends_on:
      database:
        condition: service_healthy

    volumes:
      # Uploaded files
      - mediawiki_images:/var/www/html/images
      # LocalSettings.php
      - /opt/simtwiki/LocalSettings.php:/var/www/html/LocalSettings.php:ro

    networks:
      - mediawiki

  database:
    image: mariadb:11.4

    container_name: simtwiki-database

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:
      - mediawiki_database:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - mediawiki

volumes:
  mediawiki_images:
  mediawiki_database:

networks:
  mediawiki: